<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">ShelfSentinel high level workflow</title><desc id="desc">Video is analyzed locally in the browser, converted to anonymous signals, stored temporarily on the local server, and shown as staff actions.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5fbf7"/><stop offset="1" stop-color="#e7f2eb"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11Z" fill="#2b7458"/></marker></defs>
<rect width="1400" height="430" rx="24" fill="url(#bg)"/><text x="56" y="64" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#123b2d">ShelfSentinel · privacy-first store workflow</text><text x="57" y="94" font-family="Segoe UI,Arial" font-size="15" fill="#527363">Raw video stays on the device. Only anonymous operational signals leave the edge.</text>
<g font-family="Segoe UI,Arial"><g fill="#fff" stroke="#c9dfd1" stroke-width="2"><rect x="55" y="155" width="220" height="150" rx="16"/><rect x="620" y="155" width="220" height="150" rx="16"/><rect x="895" y="155" width="215" height="150" rx="16"/></g><rect x="330" y="155" width="235" height="150" rx="16" fill="#123b2d"/><rect x="1165" y="155" width="180" height="150" rx="16" fill="#d5f0dc" stroke="#9bceb0" stroke-width="2"/>
<g font-size="13"><text x="78" y="194" font-weight="700" fill="#2b7458">01 · INPUT</text><text x="78" y="230" font-size="20" font-weight="700" fill="#123b2d">Store video</text><text x="78" y="257" fill="#527363">MP4, camera clip,</text><text x="78" y="278" fill="#527363">or demo scenario</text><text x="354" y="194" font-weight="700" fill="#a9d7b8">02 · ON DEVICE</text><text x="354" y="230" font-size="20" font-weight="700" fill="#fff">Local AI analysis</text><text x="354" y="257" fill="#cce6d4">Detect people, objects,</text><text x="354" y="278" fill="#cce6d4">zones, and movement</text><text x="643" y="194" font-weight="700" fill="#2b7458">03 · RULES</text><text x="643" y="230" font-size="20" font-weight="700" fill="#123b2d">Anonymous signal</text><text x="643" y="257" fill="#527363">Traffic, shelf, queue,</text><text x="643" y="278" fill="#527363">or interaction insight</text><text x="918" y="194" font-weight="700" fill="#2b7458">04 · MEMORY</text><text x="918" y="230" font-size="20" font-weight="700" fill="#123b2d">Local server</text><text x="918" y="257" fill="#527363">Short-lived tokens and</text><text x="918" y="278" fill="#527363">validated events only</text><text x="1188" y="194" font-weight="700" fill="#217347">05 · ACT</text><text x="1188" y="230" font-size="20" font-weight="700" fill="#123b2d">Staff action</text><text x="1188" y="257" fill="#32674a">Restock, open checkout,</text><text x="1188" y="278" fill="#32674a">or request support</text></g></g>
<g stroke="#2b7458" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M278 230H320"/><path d="M568 230H610"/><path d="M843 230H885"/><path d="M1113 230H1155"/></g><rect x="330" y="338" width="780" height="45" rx="22" fill="#123b2d"/><text x="700" y="367" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#d8f2df">Privacy boundary: no faces · no names · no raw frames sent to the server</text>
</svg>
